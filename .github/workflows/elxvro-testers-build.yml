name: ELXVRO Testers APK Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    name: Android APK Oluştur
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter sürümünü göster
        run: flutter --version

      - name: Flutter projesini bul
        shell: bash
        run: |
          set -e

          echo "Flutter projesi aranıyor..."

          PROJECT_DIR=$(find . \
            -type f \
            -name "pubspec.yaml" \
            -not -path "*/build/*" \
            -not -path "*/.dart_tool/*" \
            | head -n 1 \
            | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "pubspec.yaml bulunamadı. ZIP dosyaları kontrol ediliyor..."

            ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

            if [ -n "$ZIP_FILE" ]; then
              echo "ZIP bulundu: $ZIP_FILE"

              mkdir -p extracted_project
              unzip -q "$ZIP_FILE" -d extracted_project

              PROJECT_DIR=$(find extracted_project \
                -type f \
                -name "pubspec.yaml" \
                | head -n 1 \
                | xargs -r dirname)
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "HATA: Flutter projesi bulunamadı."
            exit 1
          fi

          echo "Flutter projesi bulundu: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Android platformunu hazırla
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ ! -d "android" ]; then
            echo "Android klasörü yok. Oluşturuluyor..."

            flutter create \
              --platforms=android \
              --org com.elxvro \
              --project-name elxvro_testers \
              .
          else
            echo "Android klasörü zaten mevcut."
          fi

      - name: Paketleri indir
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Kod analizi
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter analyze

      - name: Testleri çalıştır
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ -d "test" ] && find test -type f -name "*_test.dart" | grep -q .; then
            flutter test
          else
            echo "Test dosyası bulunmadı, adım geçiliyor."
          fi

      - name: Release APK oluştur
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          flutter build apk --release

      - name: APK kontrolü
        shell: bash
        run: |
          APK="$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "HATA: APK oluşturulamadı."
            exit 1
          fi

          ls -lh "$APK"

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: ELXVRO-Testers-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
