name: ELXVRO Testers Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Generate Android platform
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/elxvro_flutter_shell
          mkdir -p /tmp/elxvro_flutter_shell
          cd /tmp/elxvro_flutter_shell
          flutter create --platforms=android --org com.elxvro --project-name elxvro_testers elxvro_testers
          rm -rf "$GITHUB_WORKSPACE/android"
          cp -R /tmp/elxvro_flutter_shell/elxvro_testers/android "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE"
          python3 scripts/prepare_android.py

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_B64" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD"; do
            if [ -z "$value" ]; then
              echo "Eksik Android imzalama secret'i var. README içindeki dört GitHub Secret değerini ekleyin."
              exit 1
            fi
          done

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/elxvro-release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=elxvro-release.jks
          EOF

      - name: Flutter packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build signed AAB
        shell: bash
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${API_BASE_URL:-}" ]; then
            flutter build appbundle --release --dart-define="API_BASE_URL=$API_BASE_URL"
          else
            flutter build appbundle --release
          fi

      - name: Build signed APK
        shell: bash
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${API_BASE_URL:-}" ]; then
            flutter build apk --release --dart-define="API_BASE_URL=$API_BASE_URL"
          else
            flutter build apk --release
          fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: elxvro-testers-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elxvro-testers-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
